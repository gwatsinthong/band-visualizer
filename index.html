<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>SEGFAULT — Kernel Panic | Metal Band Visualizer</title>
<!-- Visitor analytics: GoatCounter (free, privacy-friendly, no cookies).
     1. Create a free account at https://www.goatcounter.com (pick a code, e.g. "segfault-band")
     2. Put that code in GOATCOUNTER_CODE below.
     Until a code is set, nothing loads and nothing is tracked.
     count.js skips localhost automatically, so dev visits aren't counted. -->
<script>
  var GOATCOUNTER_CODE = 'gwatsin'; // ← your goatcounter.com site code
  if (GOATCOUNTER_CODE) {
    var gc = document.createElement('script');
    gc.async = true;
    gc.src = 'https://gc.zgo.at/count.js';
    gc.setAttribute('data-goatcounter', 'https://' + GOATCOUNTER_CODE + '.goatcounter.com/count');
    document.head.appendChild(gc);
  }
</script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #05060a; font-family: "Segoe UI", system-ui, -apple-system, sans-serif; }
  #stage { position: absolute; inset: 0; width: 100%; height: 100%; }

  #hud {
    position: absolute; top: 14px; left: 18px; color: #e7e9f0;
    pointer-events: none; user-select: none;
  }
  #hud h1 { font-size: 18px; letter-spacing: 4px; font-weight: 800; }
  #hud h1 span { color: #f59e0b; }
  #hud p { font-size: 11px; letter-spacing: 2px; color: #8b90a3; margin-top: 3px; }
  #tracks { display: flex; gap: 6px; margin-top: 10px; pointer-events: auto; }
  #tracks .trk {
    background: rgba(13, 15, 26, 0.7); color: #8b90a3; border: 1px solid #232636;
    border-radius: 7px; padding: 5px 10px; font-size: 10px; letter-spacing: 1px;
    font-weight: 700; cursor: pointer; backdrop-filter: blur(6px); transition: all 0.12s ease;
  }
  #tracks .trk:hover { color: #e7e9f0; border-color: #3a3f5c; }
  #tracks .trk.active { color: #05060a; background: #f59e0b; border-color: #f59e0b; }

  #engine {
    position: absolute; top: 14px; left: 50%; transform: translateX(-50%);
    display: flex; gap: 4px; align-items: center; z-index: 6;
    background: rgba(13, 15, 26, 0.75); border: 1px solid #232636;
    border-radius: 11px; padding: 4px; backdrop-filter: blur(6px);
  }
  #engine .eng {
    display: flex; align-items: center; gap: 7px;
    background: transparent; color: #8b90a3; border: none; cursor: pointer;
    border-radius: 8px; padding: 7px 15px; font-size: 12px; font-weight: 800;
    letter-spacing: 2px; transition: color 0.14s ease, background 0.14s ease;
  }
  #engine .eng .ico { display: flex; }
  #engine .eng:hover { color: #e7e9f0; }
  #engine .eng.active { color: #05060a; background: #f59e0b; box-shadow: 0 0 18px rgba(245, 158, 11, 0.4); }
  #engine .eng.loading { animation: engPulse 1.1s ease-in-out infinite; }
  @keyframes engPulse { 50% { opacity: 0.45; } }

  #controls {
    position: absolute; top: 14px; right: 18px; display: flex; gap: 8px; align-items: center;
    background: rgba(13, 15, 26, 0.75); border: 1px solid #232636; border-radius: 10px;
    padding: 8px 12px; backdrop-filter: blur(6px);
  }
  #controls button {
    background: #1a1d2e; color: #e7e9f0; border: 1px solid #2c3046; border-radius: 8px;
    width: 36px; height: 32px; font-size: 14px; cursor: pointer;
  }
  #controls button:hover { background: #252941; }
  #controls label { color: #8b90a3; font-size: 11px; display: flex; align-items: center; gap: 5px; cursor: pointer; }
  #controls input[type="range"] { width: 80px; accent-color: #f59e0b; }
  #controls input[type="checkbox"] { accent-color: #f59e0b; }
  #time { color: #8b90a3; font-size: 12px; font-variant-numeric: tabular-nums; min-width: 76px; text-align: right; }

  #start {
    position: absolute; inset: 0; display: flex; flex-direction: column; gap: 18px;
    align-items: center; justify-content: center; background: rgba(5, 6, 10, 0.88);
    cursor: pointer; z-index: 10; backdrop-filter: blur(4px);
  }
  #start h2 { color: #e7e9f0; font-size: 34px; letter-spacing: 10px; font-weight: 900; }
  #start h2 span { color: #f59e0b; }
  #start p { color: #8b90a3; font-size: 13px; letter-spacing: 3px; }
  #start .btn {
    margin-top: 10px; width: 86px; height: 86px; border-radius: 50%;
    border: 2px solid #f59e0b; display: flex; align-items: center; justify-content: center;
    color: #f59e0b; font-size: 30px; box-shadow: 0 0 40px rgba(245, 158, 11, 0.35);
    transition: transform 0.15s ease;
  }
  #start:hover .btn { transform: scale(1.08); }

  /* On narrow screens the three absolute bars collide — restack them.
     #topbar is layout-inert on desktop (static, children stay absolute). */
  @media (max-width: 760px) {
    #topbar {
      position: absolute; top: 0; left: 0; right: 0; z-index: 6;
      display: flex; flex-wrap: wrap; gap: 8px; align-items: center;
      justify-content: space-between;
      padding: calc(8px + env(safe-area-inset-top)) 10px 0;
      pointer-events: none;
    }
    #topbar > * { pointer-events: auto; }
    #hud { position: static; width: 100%; pointer-events: none; }
    #hud h1 { font-size: 14px; letter-spacing: 2px; }
    #hud p { font-size: 9px; letter-spacing: 1px; }
    #tracks { margin-top: 7px; gap: 5px; }
    #tracks .trk { flex: 1; padding: 6px 4px; font-size: 9px; letter-spacing: 0.5px; white-space: nowrap; }
    #engine { position: static; transform: none; padding: 3px; }
    #engine .eng { padding: 7px 9px; font-size: 9px; letter-spacing: 1px; gap: 4px; }
    #controls { position: static; padding: 4px 7px; gap: 5px; }
    #controls button { width: 32px; height: 31px; }
    #controls label { font-size: 9px; }
    #controls #volLabel { display: none; } /* phones have hardware volume */
    #time { font-size: 11px; min-width: 0; }

    #start h2 { font-size: 22px; letter-spacing: 5px; text-align: center; padding: 0 16px; }
    #start p { font-size: 11px; letter-spacing: 2px; text-align: center; padding: 0 16px; }
  }
</style>
</head>
<body>
  <canvas id="stage"></canvas>

  <div id="topbar">
  <div id="hud">
    <h1 id="songTitle">SEGFAULT <span>//</span> KERNEL PANIC</h1>
    <p id="songSub">E MINOR · 160 BPM · GALLOPING THRASH · NO VOCALS</p>
    <div id="tracks">
      <button class="trk active" data-i="0">1 · KERNEL PANIC</button>
      <button class="trk" data-i="1">2 · NULL POINTER</button>
      <button class="trk" data-i="2">3 · STACK OVERFLOW</button>
    </div>
  </div>

  <div id="engine">
    <button class="eng active" data-mode="chip" title="8-bit chiptune engine">
      <span class="ico" aria-hidden="true"><svg viewBox="0 0 24 24" width="16" height="16"><rect x="5" y="7" width="14" height="10" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.8"/><line x1="9" y1="7" x2="9" y2="4.5" stroke="currentColor" stroke-width="1.8"/><line x1="15" y1="7" x2="15" y2="4.5" stroke="currentColor" stroke-width="1.8"/><line x1="9" y1="17" x2="9" y2="19.5" stroke="currentColor" stroke-width="1.8"/><line x1="15" y1="17" x2="15" y2="19.5" stroke="currentColor" stroke-width="1.8"/><line x1="5" y1="10" x2="2.5" y2="10" stroke="currentColor" stroke-width="1.8"/><line x1="5" y1="14" x2="2.5" y2="14" stroke="currentColor" stroke-width="1.8"/><line x1="19" y1="10" x2="21.5" y2="10" stroke="currentColor" stroke-width="1.8"/><line x1="19" y1="14" x2="21.5" y2="14" stroke="currentColor" stroke-width="1.8"/><rect x="9" y="11" width="2" height="2" fill="currentColor"/><rect x="13" y="11" width="2" height="2" fill="currentColor"/></svg></span>
      <span>8-BIT</span>
    </button>
    <button class="eng" data-mode="metal" title="Amp-sim metal engine">
      <span class="ico" aria-hidden="true"><svg viewBox="0 0 24 24" width="16" height="16"><path d="M13 2 L5 13 H11 L9 22 L19 9 H12 Z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg></span>
      <span>METAL</span>
    </button>
  </div>

  <div id="controls">
    <button id="btnPlay" title="Play / pause (space)">⏸</button>
    <button id="btnRestart" title="Restart">⏮</button>
    <label><input type="checkbox" id="chkLoop" checked> LOOP</label>
    <label id="volLabel">VOL <input type="range" id="vol" min="0" max="1" step="0.01" value="0.8"></label>
    <div id="time">0:00 / 0:00</div>
  </div>
  </div>

  <div id="start">
    <h2>SEGFAULT <span>//</span> KERNEL PANIC</h2>
    <p>A FULL METAL BAND, FALLING-NOTES STYLE</p>
    <div class="btn">▶</div>
    <p style="font-size:11px">CLICK TO PLAY · TURN IT UP 🤘</p>
  </div>

  <script src="app.js"></script>
</body>
</html>
